# Dependency updates as pull requests into dev (main only takes merges from dev).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly

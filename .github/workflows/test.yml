name: Tests

# Each commit is checked once. dev.yml runs this for every push to dev and release.yml for every
# merge to main, before they publish; pull requests into dev (Dependabot, contributors) run it
# directly. The dev -> main pull request needs no run of its own: its commits were checked when
# they reached dev, and those checks show on the pull request.
on:
  pull_request:
    branches: [dev]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Stockfish and the Python requirements
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q stockfish
          python -m pip install -r requirements.txt
      - name: Python tests
        env:
          STOCKFISH_PATH: /usr/games/stockfish
        run: python -m unittest discover -s tests -t .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fetch the art (the images are not in git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download art-2026-10-06 --repo "$GITHUB_REPOSITORY" --pattern art-built.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/art-built.zip" -d web/public
      - run: npm ci --prefix web
      - name: Type-check, lint and test the interface
        run: |
          npm --prefix web run typecheck
          npm --prefix web run lint
          npm --prefix web test
      - name: Build the interface
        run: npm --prefix web run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      # Medium and high findings fail the build; requests go through torre/net.py (http and https only).
      - name: Run bandit
        run: bandit -r torre -ll -q

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=

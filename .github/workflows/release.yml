name: Publish to PyPI and GitHub Release

# Every push to main (a merge from dev), once the tests pass: bump the version (a patch by default;
# "feat:" in a commit makes it a minor, "BREAKING CHANGE" a major), tag it, stamp CHANGELOG.md's
# Unreleased notes with it, build the interface into the package, publish the wheel and sdist to
# PyPI, and open a draft GitHub release with the wheel. The desktop installers (desktop.yml) and
# the Docker image build from that version; then the release gets checksums and its notes (that
# version's changelog section, then the downloads for each system) and is published. The new
# version and the stamped changelog are written back to main.
# Needs the repository secret PYPI_TOKEN (a PyPI token scoped to the torre project).

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency: release

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
      previous: ${{ steps.bump.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Skip a commit that is already released
        id: released
        run: |
          git fetch --tags --prune
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi

      - name: Bump the version and push the tag
        id: bump
        if: steps.released.outputs.yes != 'true'
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch
          tag_prefix: v

      - name: Set the version
        if: steps.bump.outputs.new_version
        run: sed -i "s/^__version__ = .*/__version__ = '${{ steps.bump.outputs.new_version }}'/" torre/__init__.py

      - uses: actions/setup-node@v7
        if: steps.bump.outputs.new_version
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        if: steps.bump.outputs.new_version
        with:
          python-version: "3.12"

      - name: Stamp the changelog with the version
        if: steps.bump.outputs.new_version
        run: python -m torre.tools.changelog stamp "${{ steps.bump.outputs.new_version }}"
      - uses: actions/upload-artifact@v7
        if: steps.bump.outputs.new_version
        with:
          name: changelog
          path: CHANGELOG.md

      - name: Fetch the art and build the interface into torre/ui
        if: steps.bump.outputs.new_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download art-2026-10-06 --repo "$GITHUB_REPOSITORY" --pattern art-built.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/art-built.zip" -d web/public
          npm ci --prefix web
          npm --prefix web run build

      - name: Build the wheel and sdist
        if: steps.bump.outputs.new_version
        run: |
          python -m pip install build twine
          python -m build

      - name: Publish to PyPI
        if: steps.bump.outputs.new_version
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload dist/* --non-interactive

      - name: Open a draft GitHub release
        if: steps.bump.outputs.new_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.new_version }}" dist/*.whl --draft \
            --title "v${{ steps.bump.outputs.new_version }}" \
            --notes "The installers are being built; this release is published when they are ready."

      - name: Write the version and the changelog back to main
        if: steps.bump.outputs.new_version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add torre/__init__.py CHANGELOG.md
          git commit -m "Release v${{ steps.bump.outputs.new_version }} [skip ci]" || exit 0
          git push origin HEAD:main

  docker:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  desktop:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  publish:
    needs: [release, desktop]
    # Publish even when one system's installer failed: PyPI already has this version, and the
    # notes list only the downloads that exist. Rerun desktop.yml by hand to add the rest.
    if: ${{ !cancelled() && needs.release.outputs.version != '' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: changelog  # the stamped CHANGELOG.md, over the tag's copy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Add checksums for every download
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir assets --clobber
          rm -f assets/SHA256SUMS.txt
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt)
          gh release upload "v$VERSION" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Write the notes and publish the release
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets > assets.json
          python -m torre.tools.changelog notes "$VERSION" --assets assets.json --repo "$GITHUB_REPOSITORY" \
            --previous "${{ needs.release.outputs.previous }}" > notes.md
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --draft=false --latest

name: Publish to PyPI and GitHub Release

# Every push to main (a merge from dev) releases, Faro's way: decide the version, build everything
# side by side, and make it public only once every piece is there.
#   prepare  the next version (a patch by default; "feat:" in a commit makes it a minor,
#            "BREAKING CHANGE" a major), CHANGELOG.md's Unreleased notes stamped with it, the
#            interface built into the wheel and sdist, and a draft GitHub release with the wheel.
#   then, in parallel: the tests, the desktop downloads for every system (desktop.yml) and the
#            Docker image (docker.yml, which pushes as soon as it is built and checked).
#   publish  checks that every download is on the draft, tags the commit, publishes to PyPI,
#            writes the version and the stamped changelog back to main, adds checksums, writes the
#            notes (that version's changelog section, then the downloads for each system) and
#            publishes the release.
# If any of it fails, nothing reaches PyPI or the releases page: rerun the failed jobs. Each step
# of publish is safe to repeat.
# Needs the repository secret PYPI_TOKEN (a PyPI token scoped to the torre project).

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency: release

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
      previous: ${{ steps.bump.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Skip a commit that is already released
        id: released
        run: |
          git fetch --tags --prune
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi

      # Only works the version out: the tag is made by publish, once the release is complete.
      - name: Work out the next version
        id: bump
        if: steps.released.outputs.yes != 'true'
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch
          tag_prefix: v
          dry_run: true

      - name: Set the version
        if: steps.bump.outputs.new_version
        run: sed -i "s/^__version__ = .*/__version__ = '${{ steps.bump.outputs.new_version }}'/" torre/__init__.py

      - uses: actions/setup-node@v7
        if: steps.bump.outputs.new_version
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        if: steps.bump.outputs.new_version
        with:
          python-version: "3.12"

      - name: Stamp the changelog with the version
        if: steps.bump.outputs.new_version
        run: python -m torre.tools.changelog stamp "${{ steps.bump.outputs.new_version }}"
      - uses: actions/upload-artifact@v7
        if: steps.bump.outputs.new_version
        with:
          name: changelog
          path: CHANGELOG.md

      - name: Fetch the art and build the interface into torre/ui
        if: steps.bump.outputs.new_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download art-2026-10-06 --repo "$GITHUB_REPOSITORY" --pattern art-built.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/art-built.zip" -d web/public
          npm ci --prefix web
          npm --prefix web run build

      - name: Build the wheel and sdist
        if: steps.bump.outputs.new_version
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        if: steps.bump.outputs.new_version
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Open a draft GitHub release
        if: steps.bump.outputs.new_version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail
          # A draft left by an earlier run that never published is replaced.
          if [ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "v$VERSION" --yes
          fi
          gh release create "v$VERSION" dist/*.whl --draft --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes "The downloads are being built; this release is published when they are all ready."

  test:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/test.yml

  desktop:
    needs: prepare
    if: needs.prepare.outputs.version != ''
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  docker:
    needs: [prepare, test]
    if: needs.prepare.outputs.version != ''
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  publish:
    needs: [prepare, test, desktop, docker]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: changelog  # the stamped CHANGELOG.md, over the commit's copy
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check that every download is on the release
        run: |
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets > assets.json
          python -m torre.tools.changelog check "$VERSION" --assets assets.json

      # Through the API: a git push of the tag is refused whenever the commit changes a workflow,
      # which the job's token may not do.
      - name: Tag the release
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" --silent
          fi

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install twine
          python -m twine upload dist/* --non-interactive --skip-existing

      - name: Write the version and the changelog back to main
        run: |
          sed -i "s/^__version__ = .*/__version__ = '$VERSION'/" torre/__init__.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add torre/__init__.py CHANGELOG.md
          git commit -m "Release v$VERSION [skip ci]" || exit 0
          git push origin HEAD:main

      - name: Add checksums for every download
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir assets --clobber
          rm -f assets/SHA256SUMS.txt
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt)
          gh release upload "v$VERSION" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Write the notes and publish the release
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets > assets.json
          python -m torre.tools.changelog notes "$VERSION" --assets assets.json --repo "$GITHUB_REPOSITORY" \
            --previous "${{ needs.prepare.outputs.previous }}" > notes.md
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --draft=false --latest
